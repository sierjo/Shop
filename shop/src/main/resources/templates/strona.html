<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/StronaCSS.css}"/>
    <title>Title</title>
</head>

            <a sec:authorize="isAnonymous()" th:href="@{/login}">Войти</a>

            <div sec:authorize="isAuthenticated()" class="loginBox">
                <!--                <span sec:authentication="name"></span>-->
                <span th:text="${currentUser.email}" class="loginName"></span>

                <a th:href="@{/logout}" class="userLogout">Выйти</a>
            </div>
        </nav>
    </header>
    <!------------------------------------------------------------------------------->
    <aside class="sidebar" sec:authorize="hasAnyAuthority('Klient','ROLE_ANONYMOUS')">
        <section class="filters">
            <h3>Категории</h3>
            <ul>
                <li>Ноутбуки</li>
                <li>Телефоны</li>
            </ul>
        </section>
    </aside>

    <aside class="sidebar" sec:authorize="hasAnyAuthority('Magazynier')">
        <section class="filters">
            <h3>Действия</h3>
            <ul>
                <li>
                    <a th:href="@{/products}">Добавить товар</a>
                </li>
            </ul>
        </section>
    </aside>
    <!------------------------------------------------------------------------------->
    <main class="content">

        <section th:each="product : ${products}" class="products-catalog">

            <div class="products-grid" sec:authorize="hasAnyAuthority('Klient','ROLE_ANONYMOUS')">
                <article class="product-card">
                    <img th:if="${product.productPhoto != null}"
                         th:src="@{'/photos/products/' + ${product.productId} + '/' + ${product.productPhoto}}"
                         alt="Product Image"
                         class="productCartImg"/>

                    <img th:unless="${product.productPhoto != null}"
                         th:src="@{/images/no-image.png}"
                         alt="No Image"
                         class="ImgError"/>

                    <h3 th:text="${product.productName}">Название товара</h3>
                    <p th:text="${product.productDescription}">Описание</p>
                    <h4 class="productPrice" th:text="${product.productPrice} + ' PLN'">Цена</h4>

                        <div class="add-to-favorite" sec:authorize="hasAnyAuthority('Klient')">
                            <a href="javascript:void(0);" class="icons"
                               th:onclick="'addTOFavorite(' + ${product.productId} + ')'">

                                <svg th:id="'fevor-add' + ${product.productId}" class="my-custom-icon" xmlns="http://www.w3.org/2000/svg"
                                     width="17" height="12"
                                     viewBox="0 0 26.00 25.00" fill="#492f2f"
                                     data-guides="{&quot;vertical&quot;:[],&quot;horizontal&quot;:[]}">
                                    <defs/>
                                    <path d="M18.14 2.5C20.8827 2.5655 23.5559 5.337 23.5 8.08C23.5 14.28 15.73 20.66 13 22.5C10.27 20.65 2.5 14.27 2.5 8.08C2.4441 5.337 5.1173 2.5655 7.86 2.5C9.2574 2.509 10.6006 2.9304 11.5 4C12.0067 4.6 12.4933 5.4 13 6C13.5067 5.4033 13.9933 4.5967 14.5 4C15.3975 2.9267 16.7409 2.5115 18.14 2.5ZM18.14 1C16.1573 1.0063 14.2777 1.8839 13 3.4C11.7223 1.8839 9.8427 1.0063 7.86 1C4.0104 1.0603 0.9388 4.2304 1 8.08C1 16.92 13 24 13 24C13 24 25 16.92 25 8.08C25.0612 4.2304 21.9896 1.0603 18.14 1Z"/>
                                </svg>
                            </a>
                            <a href="javascript:void(0);" class="icons"
                               th:onclick="'addTOCart(' + ${product.productId} + ')'">
                                <svg th:id="'cart-add' + ${product.productId}" class="my-custom-cart-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="12"
                                     viewBox="0 0 26.00 25.00" fill="#492f2f" data-guides="{&quot;vertical&quot;:[],&quot;horizontal&quot;:[]}">
                                    <defs/>
                                    <path fill="transparent" stroke="#000000" fill-opacity="1" stroke-width="1" stroke-opacity="1" id="tSvg176b0a2b0fe" title="Path 3" d="M4 5L6.5 5.5C6.5 5.5 6.5 5.5 6.5 5.5L8.9213 16.1537C8.9722 16.3776 8.9439 16.6123 8.8412 16.8177L8.222 18.056C8.0822 18.3355 8.0822 18.6645 8.222 18.944L8.25 19C8.4032 19.3064 8.7164 19.5 9.059 19.5H22.5" pointer-events="none"/>
                                    <path fill="transparent" fill-opacity="1" stroke="#000000" stroke-opacity="1" stroke-width="1" id="tSvg84930e6073" title="Ellipse 1" d="M21 20.868C21.5523 20.868 22 21.3052 22 21.8445C22 22.3838 21.5523 22.821 21 22.821C20.4477 22.821 20 22.3838 20 21.8445C20 21.3052 20.4477 20.868 21 20.868Z" pointer-events="none" style="transform-origin: 21px 21.84px;"/>
                                    <path fill="transparent" fill-opacity="1" stroke="#000000" stroke-opacity="1" stroke-width="1" id="tSvg9d51f881b0" title="Ellipse 2" d="M10.9737 20.934C11.5115 20.934 11.9475 21.3416 11.9475 21.8445C11.9475 22.3473 11.5115 22.755 10.9737 22.755C10.436 22.755 10 22.3473 10 21.8445C10 21.3416 10.436 20.934 10.9737 20.934Z" pointer-events="none" style="transform-origin: 10.97px 21.84px;"/>

                                </svg>
                            </a>
                        </div>
                        <div class="add-to-favorite" sec:authorize="hasAnyAuthority('ROLE_ANONYMOUS')">
                            <a href="/login" class="icons"
                               th:onclick="'addTOFavorite(' + ${product.productId} + ')'">

                                <svg th:id="fevor-add" class="my-custom-icon" xmlns="http://www.w3.org/2000/svg"
                                     width="17" height="12"
                                     viewBox="0 0 26.00 25.00" fill="#492f2f"
                                     data-guides="{&quot;vertical&quot;:[],&quot;horizontal&quot;:[]}">
                                    <defs/>
                                    <path d="M18.14 2.5C20.8827 2.5655 23.5559 5.337 23.5 8.08C23.5 14.28 15.73 20.66 13 22.5C10.27 20.65 2.5 14.27 2.5 8.08C2.4441 5.337 5.1173 2.5655 7.86 2.5C9.2574 2.509 10.6006 2.9304 11.5 4C12.0067 4.6 12.4933 5.4 13 6C13.5067 5.4033 13.9933 4.5967 14.5 4C15.3975 2.9267 16.7409 2.5115 18.14 2.5ZM18.14 1C16.1573 1.0063 14.2777 1.8839 13 3.4C11.7223 1.8839 9.8427 1.0063 7.86 1C4.0104 1.0603 0.9388 4.2304 1 8.08C1 16.92 13 24 13 24C13 24 25 16.92 25 8.08C25.0612 4.2304 21.9896 1.0603 18.14 1Z"/>
                                </svg>
                            </a>
                        </div>
                        <p th:id="'error-text' + ${product.productId}"></p>

                </article>
            </div>

            <div class="products-grid" sec:authorize="hasAnyAuthority('Magazynier')">

                <article class="product-card">

                    <img th:if="${product.productPhoto != null}"
                         th:src="@{'/photos/products/' + ${product.productId} + '/' + ${product.productPhoto}}"
                         alt="Product Image"
                         class="productCartImg"/>

                    <img th:unless="${product.productPhoto != null}"
                         th:src="@{/images/no-image.png}"
                         alt="No Image"
                         class="ImgError"/>

                    <h3 th:id="'name-text-' + ${product.productId}" th:text="${product.productName}">Название</h3>
                    <input type="text" th:id="'name-input-' + ${product.productId}" class="input-update"
                           th:value="${product.productName}">

                    <h4 th:id="'price-text-' + ${product.productId}" class="text-button-update"
                        th:text="${product.productPrice} + ' PLN'">Цена</h4>
                    <input type="number" step="0.01" th:id="'price-input-' + ${product.productId}" class="input-update"
                           th:value="${product.productPrice}">

                    <p th:id="'desc-text-' + ${product.productId}" th:text="${product.productDescription}">Описание</p>

                    <textarea class="input-update" th:id="'desc-input-' + ${product.productId}"
                              th:text="${product.productDescription}"></textarea>

                    <button th:id="'btn-edit-' + ${product.productId}"
                            th:onclick="'startEdit(' + ${product.productId} + ')'">Изменить
                    </button>

                    <button class="update-button-save-color" th:id="'btn-save-' + ${product.productId}"
                            th:onclick="'saveEdit(' + ${product.productId} + ')'"
                    > Сохранить
                    </button>

                    <button class="update-button-save-color update-button-cancel-color"
                            th:id="'btn-cancel-' + ${product.productId}"
                            th:onclick="'cancelEdit(' + ${product.productId} + ')'"
                    > Отмена
                    </button>
                </article>
            </div>
        </section>

    </main>


</div>
<script th:src="@{/js/editProduct.js}"></script>
</body>
</html>
