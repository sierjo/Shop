<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/YourShop.css}"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>

            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn-login">Zalogować</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="loginBox">
                <span th:text="${currentUser.email}" class="loginName"></span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout">Wyloguj</button>

    </header>

    <aside class="sidebar" sec:authorize="hasAnyAuthority('Klient','ROLE_ANONYMOUS')">
        <section class="filters">
            <h3>Kategorie produktów</h3>
            <ul>
                <li>Laptopy</li>
                <li>Telefony</li>
            </ul>
        </section>
    </aside>

    <aside class="sidebar" sec:authorize="hasAnyAuthority('Magazynier')">
        <section class="filters">
            <h3>Możliwe Działania</h3>
            <ul>
                <li>
                    <a th:href="@{/products}">Dodaj produkt</a>
                </li>
                <li>
                    <a th:href="@{/order/assembling}">Zbieranie zamówień do wysyłki</a>
                </li>
            </ul>
        </section>
    </aside>
    <!------------------------------------------------------------------------------->
    <main class="content">

        <section th:each="product : ${products}" class="products-catalog">

            <div class="products-grid" sec:authorize="hasAnyAuthority('Klient','ROLE_ANONYMOUS')">
                <article class="product-card">

                    <div class="card-image-wrapper">
                        <img th:if="${product.productPhoto != null}"
                             th:src="@{'/photos/products/' + ${product.productId} + '/' + ${product.productPhoto}}"
                             alt="Product Image"
                             class="productCartImg"/>

                        <img th:unless="${product.productPhoto != null}"
                             th:src="@{/images/no-image.png}"
                             alt="No Image"
                             class="ImgError"/>
                    </div>

                    <div class="card-info-wrapper">
                        <h3 th:text="${product.productName}">Nazwa productu</h3>
                        <p th:text="${product.productDescription}">Opis</p>
                        <p th:id="'error-text' + ${product.productId}" style="color: red; font-size: 12px;"></p>
                    </div>

                    <div class="card-action-wrapper">
                        <h4 class="productPrice" th:text="${product.productPrice} + ' PLN'">Cena</h4>

                        <div class="action-buttons-group">
                            <div class="add-to-favorite" sec:authorize="hasAnyAuthority('Klient')">
                                <a href="javascript:void(0);" class="icons"
                                   th:onclick="'addTOFavorite(' + ${product.productId} + ')'">

                                    <svg th:id="'fevor-add' + ${product.productId}" class="my-custom-icon" width="24"
                                         height="24" viewBox="0 0 32.00 32.00"
                                         xmlns="http://www.w3.org/2000/svg">
                                        <defs/>
                                        <path fill="rgb(101, 101, 101)" stroke="none" fill-opacity="1" stroke-width="1"
                                              stroke-opacity="1" id="tSvg8feeb7b167" title="Path 2"

            <div class="products-grid" sec:authorize="hasAnyAuthority('Magazynier')">

                <article class="product-card">
                    <div class="card-image-wrapper">
                        <img th:if="${product.productPhoto != null}"
                             th:src="@{'/photos/products/' + ${product.productId} + '/' + ${product.productPhoto}}"
                             alt="Product Image"
                             class="productCartImg"/>

                        <img th:unless="${product.productPhoto != null}"
                             th:src="@{/images/no-image.png}"
                             alt="No Image"
                             class="ImgError"/>
                    </div>

                    <div class="card-info-wrapper">
                        <h3 th:id="'name-text-' + ${product.productId}" th:text="${product.productName}">Nazwa
                            productu</h3>
                        <input type="text" th:id="'name-input-' + ${product.productId}" class="input-update"
                               th:value="${product.productName}">

                        <p th:id="'desc-text-' + ${product.productId}" th:text="${product.productDescription}">
                            Opis</p>
                        <textarea class="input-update" th:id="'desc-input-' + ${product.productId}"
                                  th:text="${product.productDescription}"></textarea>
                    </div>

                    <div class="card-action-wrapper">
                        <h4 th:id="'price-text-' + ${product.productId}" class="text-button-update"
                            th:text="${product.productPrice} + ' PLN'">Cena</h4>
                        <input type="number" step="0.01" th:id="'price-input-' + ${product.productId}"
                               class="input-update"
                               th:value="${product.productPrice}">

                        <div class="action-buttons-group">
                            <button class="btn-edit-action"
                                    th:id="'btn-edit-' + ${product.productId}"
                                    th:onclick="'startEdit(' + ${product.productId} + ')'">
                                Zmienić
                            </button>

                            <button class="update-button-save-color"
                                    th:id="'btn-save-' + ${product.productId}"
                                    th:onclick="'saveEdit(' + ${product.productId} + ')'">
                                Zachować
                            </button>

                            <button class="update-button-save-color update-button-cancel-color"
                                    th:id="'btn-cancel-' + ${product.productId}"
                                    th:onclick="'cancelEdit(' + ${product.productId} + ')'">
                                Cofnąć
                            </button>
                        </div>
                    </div>
                </article>
            </div>
        </section>
    </main>

</div>
<script th:src="@{/js/editProduct.js}"></script>
</body>
</html>
