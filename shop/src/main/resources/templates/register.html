<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css} "/>
<!--    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/Registration.css}"/>-->
    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/YourShop.css}"/>

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Registration</title>
</head>
<body>

<div class="auth-wrapper">
    <div class="form-box">
        <h2>Rejestracja</h2>

        <form th:action="@{/register/new}" th:object="${user}" method="post">

            <div th:if="${error}" class="alert-danger" role="alert">
                <p th:text="${error}"></p>
            </div>

            <div class="form-group">
                <input placeholder="Email" name="email" th:field="*{email}" type="email" class="form-control" required/>
            </div>

            <div class="form-group">
                <input placeholder="Numer telefonu" name="phoneNumber" th:field="*{phoneNumber}" type="tel" class="form-control" required/>
            </div>

            <div class="form-group">
                <input min="8" placeholder="Hasło" name="password" th:field="*{password}" type="password" class="form-control" required/>
            </div>

            <button type="submit" class="btn-block">Zarejestruj się</button>

            <div class="form-footer-text">
                Masz już konto?
                <a th:href="@{/login}">Zaloguj się</a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
