<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Оформление заказа</title>
    <link rel="stylesheet" type="text/css" media="all" th:href="@{/css/MakingOrderCSS.css}"/>
</head>
<body>

<main class="checkout-container">
    <div class="checkout-content">
        <section class="checkout-form-section">
            <form action="/order/submit" method="post" class="address-form" id="checkoutForm" onsubmit="return validateAndSubmitForm(event)">

                <div class="checkout-header-flex">
                    <div>
                        <h2>Odbiorca przesyłki</h2>
                        <div class="form-intro">
                            <p>Wprowadź swoje dane lub wybierz istniejący adres!</p>
                        </div>
                    </div>

                    <div class="saved-address-wrapper" th:if="${not #lists.isEmpty(userAddresses)}">
                        <label for="selectedAddressId">Wybierz zapisany adres:</label>
                        <select id="selectedAddressId" name="selectedAddressId" onchange="handleAddressSelection()">
                            <option value="">-- Nowy adres --</option>

                            <option th:each="addr : ${userAddresses}"
                                    th:value="${addr.addressId}"
                                    th:data-name="${addr.name}"
                                    th:data-surname="${addr.surname}"
                                    th:data-street="${addr.streetAddress}"
                                    th:data-building="${addr.houseNumberAddress}"
                                    th:data-apt="${addr.apartmentNumberAddress}"
                                    th:data-zip="${addr.code}"
                                    th:data-city="${addr.cityAddress}"
                                    th:data-country="${addr.countryAddress}"
                                    th:text="${addr.streetAddress + ' ' + addr.houseNumberAddress +
                                    (!#strings.isEmpty(addr.apartmentNumberAddress) ? '/'
                                    + addr.apartmentNumberAddress : '') +', ' + addr.code}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <input type="text" id="firstName" name="firstName" placeholder="imię" class="new-addr-input" required>
                </div>

                <div class="form-group">
                    <input type="text" id="lastName" name="lastName" placeholder="nazwisko" class="new-addr-input" required>
                </div>

                <div class="form-row phone-row">
                    <div class="form-group select-group">
                        <label for="phoneCode" class="floating-label">kierunkowy numer</label>
                        <select id="phoneCode" name="phoneCode">
                            <option value="+48" selected>PL (+48)</option>
                            <option value="+1">US/CA (+1)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="nr komórkowy" class="new-addr-input" required>
                    </div>
                </div>

                <div class="form-group select-group country-group">
                    <label for="country" class="floating-label">kraj</label>
                    <select id="country" name="country">
                        <option value="PL" selected>Poland</option>
                        <option value="US">United States</option>
                    </select>
                </div>

                <div class="form-group">
                    <input type="text" id="street" name="street" placeholder="ulica" class="new-addr-input" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="buildingNo" name="buildingNo" placeholder="nr budynku" class="new-addr-input" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="aptNo" name="aptNo" placeholder="nr mieszkania">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="zipCode" name="zipCode" placeholder="kod pocztowy" class="new-addr-input" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="city" name="city" placeholder="miejscowość" class="new-addr-input" required>
                    </div>
                </div>

                <div class="form-footer">

                    <div id="saveAddressCheckboxWrapper" th:if="${not #lists.isEmpty(userAddresses)}">
                        <input type="checkbox" id="saveNewAddress" name="saveNewAddress" value="true">
                        <label for="saveNewAddress">Dodaj nowy adres</label>
                    </div>

                    <input type="hidden" name="saveNewAddress" value="true" th:if="${#lists.isEmpty(userAddresses)}">

                    <p><strong>Twój domyślny adres</strong></p>
                    <button type="submit" class="btn-submit">ZAPISZ I KONTYNUUJ</button>

                </div>
            </form>
        </section>

        <aside class="checkout-sidebar">
            <div class="summary-box">
                <h3>Podsumowanie</h3>
                <div class="summary-details">
                    <div class="summary-row">
                        <span>Wartość produktów</span>
                        <span th:text="${totalPrice} + ' PLN'">0.00 PLN</span>
                    </div>
                </div>
                <div class="summary-total">
                    <span>Razem</span>
                    <span class="total-price" th:text="${totalPrice} + ' PLN'"></span>
                </div>
            </div>
        </aside>
    </div>
</main>
<script type="text/javascript" th:src="@{/js/orderForm.js}"></script>

</body>
</html>
